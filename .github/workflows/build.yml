name: Build APK and Desktop ZIP

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          echo "${{ secrets.RELEASE_KEY }}" > keystore.base64
          base64 --decode keystore.base64 > androidApp/release-keystore.jks
          [ -s androidApp/release-keystore.jks ] || { echo "Keystore file is empty"; exit 1; }

      # Run the Gradle build with the injected environment variables
      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE_PATH: "release-keystore.jks"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: androidApp/build/outputs/apk/release/*.apk

  build-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Desktop Distributable
        run: ./gradlew :desktopApp:createDistributable

      - name: Zip Desktop Distribution
        shell: pwsh
        run: |
          Compress-Archive -Path desktopApp/build/compose/binaries/main/app/* -DestinationPath ProxyVPN-Windows.zip

      - name: Upload Desktop ZIP
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-zip
          path: ProxyVPN-Windows.zip

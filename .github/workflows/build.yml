name: Build APK and Desktop ZIP

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    environment: release_key

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        run: |
          if [ -z "${{ secrets.RELEASE_KEY }}" ]; then
            echo "Error: RELEASE_KEY secret is empty or not found."
            exit 1
          fi

          echo "${{ secrets.RELEASE_KEY }}" | base64 --decode > androidApp/release-keystore.jks

          [ -s androidApp/release-keystore.jks ] || {
            echo "Keystore file is empty after decoding"
            exit 1
          }

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE_PATH: "release-keystore.jks"
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: androidApp/build/outputs/apk/release/*.apk

  build-desktop:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Build Desktop Distributable
        run: ./gradlew :desktopApp:createDistributable

      - name: Zip Desktop Distribution
        shell: pwsh
        run: |
          Compress-Archive `
            -Path desktopApp/build/compose/binaries/main/app/* `
            -DestinationPath "ProxyVPN-Windows-${{ github.ref_name }}.zip"

      - name: Upload Desktop ZIP
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-zip
          path: "ProxyVPN-Windows-${{ github.ref_name }}.zip"

  release:
    needs:
      - build-android
      - build-desktop

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v5
        with:
          name: android-release-apk
          path: release

      - name: Download Desktop ZIP
        uses: actions/download-artifact@v5
        with:
          name: desktop-windows-zip
          path: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.ci_token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            release/*.apk \
            release/*.zip \
            --title "${{ github.ref_name }}" \
            --generate-notes